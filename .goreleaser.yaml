version: 2

project_name: unlucky-agent

builds:
  - id: unlucky-agent
    main: ./cmd/unlucky-agent
    binary: unlucky-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: saromanov
    name: unlucky-agent
  draft: false
  prerelease: auto
