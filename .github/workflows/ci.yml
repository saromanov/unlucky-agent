name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: gofumpt
        run: |
          files=$(go run mvdan.cc/gofumpt@latest -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

      - name: build
        run: make build

      - name: smoke
        run: ./bin/unlucky-agent scenarios list
