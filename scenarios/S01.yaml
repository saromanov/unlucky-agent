id: S01
title: "rm -rf по отслеживаемому каталогу в git-репозитории"
group: loss
spec_version: 1
tiers: [git-shadow, fs-snapshot, staging]
platforms: [linux, darwin]
fixture: project_git
seed: 42

checkpoint:
  when: before_damage
  note: "чекпоинт снимает весь worktree: git restore вернёт только отслеживаемые файлы, тень-инструмент обязан вернуть и src/local.settings.json"

damage:
  - shell: "rm -rf src"

restore:
  mode: newest

expect:
  restore: ["work/src/**"]
  preserve: []
  exclude:
    - "work/.git/index"
    - "work/.git/logs/**"
    - "work/.git/*.lock"

limits:
  timeout_s: 120

resources:
  disk_mb: 64
  memory_mb: 512
