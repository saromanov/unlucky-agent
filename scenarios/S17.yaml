id: S17
title: "Диск заполнен на 95% в момент чекпойнта"
group: failure
spec_version: 1
tiers: [git-shadow, fs-snapshot, staging]
platforms: [linux]
fixture: project_basic
seed: 42

checkpoint:
  when: before_damage
  pre:
    - shell: |
        # work holds disk_mb + 64 MB = 128 MB in the docker sandbox; fill ~95%
        # (121 MB). On the local driver this is a bounded fill, never 95% of
        # the host disk.
        mkdir -p .diskfill
        dd if=/dev/zero of=.diskfill/diskfill.img bs=1M count=$(( (128 * 95) / 100 ))
  note: "чекпойнт снимается, когда work заполнен на ~95% в docker-песочнице (tmpfs 128M); чекпойнт и откат обязаны отработать явно, а не молча потерять чекпойнт; .diskfill исключён из сравнения"

damage:
  - shell: "rm -rf src docs"

restore:
  mode: newest

expect:
  restore: ["work/src/**", "work/docs/**"]
  preserve: []
  exclude:
    - "work/.diskfill/**"
    - "work/.git/index"
    - "work/.git/logs/**"
    - "work/.git/*.lock"

limits:
  timeout_s: 300

resources:
  disk_mb: 64
  memory_mb: 512
